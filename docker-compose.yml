services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: coti-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-coti}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-coti}
      POSTGRES_DB: ${POSTGRES_DB:-coti}
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-coti} -d ${POSTGRES_DB:-coti}']
      interval: 2s
      timeout: 3s
      retries: 20

  mailpit:
    image: axllent/mailpit:v1.21
    container_name: coti-mailpit
    restart: unless-stopped
    ports:
      - '1025:1025' # SMTP
      - '8025:8025' # web UI

  api:
    container_name: coti-api
    restart: unless-stopped
    build:
      context: .
      dockerfile: ./docker/api.Dockerfile
    ports:
      - '8000:8000'
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env
    # The .env URLs point at the host, and inside the compose network the database is the
    # `postgres` service: in here localhost is the API's own container. Both are overridden for
    # that reason, and the port Postgres publishes to the host stops mattering to this stack.
    environment:
      - DATABASE_URL=postgres://coti_app:coti_app@postgres:5432/${POSTGRES_DB:-coti}?sslmode=disable
      - DATABASE_ADMIN_URL=postgres://${POSTGRES_USER:-coti}:${POSTGRES_PASSWORD:-coti}@postgres:5432/${POSTGRES_DB:-coti}?sslmode=disable
      # For the same reason the mail sandbox is the `mailpit` service. It speaks plain SMTP, so
      # the stack pins the TLS expectation too; which provider is used stays the .env's call.
      - MAIL_SMTP_HOST=mailpit
      - MAIL_SMTP_PORT=1025
      - MAIL_SMTP_STARTTLS=false
      # The local storage adapter writes inside the container, so without a volume every
      # uploaded file is lost on the next rebuild.
      - STORAGE_LOCAL_DIR=/var/lib/coti/storage
    volumes:
      - api_storage:/var/lib/coti/storage

  backoffice:
    container_name: coti-backoffice
    restart: unless-stopped
    build:
      context: .
      dockerfile: ./docker/backoffice.Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    ports:
      - '3000:3000'
    environment:
      - NODE_ENV=production
      - PORT=3000

  webapp:
    container_name: coti-webapp
    restart: unless-stopped
    build:
      context: .
      dockerfile: ./docker/webapp.Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    ports:
      - '3001:3001'
    environment:
      - NODE_ENV=production
      - PORT=3001

volumes:
  postgres_data:
  api_storage:

networks:
  default:
    name: coti-network
