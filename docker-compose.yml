services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: coti-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-coti}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-coti}
      POSTGRES_DB: ${POSTGRES_DB:-coti}
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-coti} -d ${POSTGRES_DB:-coti}']
      interval: 2s
      timeout: 3s
      retries: 20

  api:
    container_name: coti-api
    restart: unless-stopped
    build:
      context: .
      dockerfile: ./docker/api.Dockerfile
    ports:
      - '8000:8000'
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env
    # Las URLs del .env apuntan al host, y dentro de la red de compose el host de la base es
    # el servicio `postgres`: ahí localhost es el contenedor del API. Por eso se sobreescriben
    # las dos, y el puerto que Postgres publica al host deja de importar para el stack
    # dockerizado.
    environment:
      - DATABASE_URL=postgres://coti_app:coti_app@postgres:5432/${POSTGRES_DB:-coti}?sslmode=disable
      - DATABASE_ADMIN_URL=postgres://${POSTGRES_USER:-coti}:${POSTGRES_PASSWORD:-coti}@postgres:5432/${POSTGRES_DB:-coti}?sslmode=disable

  backoffice:
    container_name: coti-backoffice
    restart: unless-stopped
    build:
      context: .
      dockerfile: ./docker/backoffice.Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    ports:
      - '3000:3000'
    environment:
      - NODE_ENV=production
      - PORT=3000

  webapp:
    container_name: coti-webapp
    restart: unless-stopped
    build:
      context: .
      dockerfile: ./docker/webapp.Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    ports:
      - '3001:3001'
    environment:
      - NODE_ENV=production
      - PORT=3001

volumes:
  postgres_data:

networks:
  default:
    name: coti-network
