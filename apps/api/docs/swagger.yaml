basePath: /
definitions:
  dto.AccountResponse:
    properties:
      brand_color:
        type: string
      brand_logo_url:
        type: string
      created_at:
        type: string
      id:
        type: string
      is_active:
        type: boolean
      legal_name:
        type: string
      name:
        type: string
      tax_id:
        type: string
      updated_at:
        type: string
    type: object
  dto.AddAlternativeRequest:
    properties:
      alternative_product_id:
        type: string
      type:
        enum:
        - EQUIVALENT
        - PREMIUM
        - ECONOMY
        type: string
    required:
    - alternative_product_id
    - type
    type: object
  dto.AddSynonymRequest:
    properties:
      source:
        enum:
        - MANUAL
        - LEARNED
        type: string
      term:
        maxLength: 255
        minLength: 1
        type: string
    required:
    - term
    type: object
  dto.AlternativeListResponse:
    properties:
      direction:
        type: string
      items:
        items:
          $ref: '#/definitions/dto.AlternativeResponse'
        type: array
    type: object
  dto.AlternativeResponse:
    properties:
      alternative_product_id:
        type: string
      base_product_id:
        type: string
      created_at:
        type: string
      id:
        type: string
      product:
        $ref: '#/definitions/dto.ProductResponse'
      type:
        type: string
    type: object
  dto.AvailabilityListResponse:
    properties:
      items:
        items:
          $ref: '#/definitions/dto.AvailabilityResponse'
        type: array
    type: object
  dto.AvailabilityResponse:
    properties:
      branch_id:
        type: string
      created_at:
        type: string
      id:
        type: string
      is_active:
        type: boolean
      product_id:
        type: string
      stock:
        description: decimal string; null when the branch does not track it.
        type: string
      updated_at:
        type: string
    type: object
  dto.BranchListResponse:
    properties:
      items:
        items:
          $ref: '#/definitions/dto.BranchResponse'
        type: array
    type: object
  dto.BranchResponse:
    properties:
      address:
        type: string
      created_at:
        type: string
      default_expiry_days:
        type: integer
      id:
        type: string
      is_active:
        type: boolean
      name:
        type: string
      updated_at:
        type: string
    type: object
  dto.CatalogImportInput:
    properties:
      code:
        type: string
      description:
        type: string
      family:
        type: string
      min_price:
        type: string
      name:
        type: string
      price:
        type: string
      subgroup:
        type: string
      unit:
        type: string
    type: object
  dto.CatalogImportPreviewResponse:
    properties:
      can_confirm:
        type: boolean
      invalid_rows:
        type: integer
      previewed_at:
        type: string
      rows:
        items:
          $ref: '#/definitions/dto.CatalogImportRowResponse'
        type: array
      valid_rows:
        type: integer
    type: object
  dto.CatalogImportRowResponse:
    properties:
      code:
        type: string
      description:
        type: string
      errors:
        items:
          type: string
        type: array
      family:
        type: string
      min_price:
        type: string
      name:
        type: string
      price:
        type: string
      row_number:
        type: integer
      subgroup:
        type: string
      unit:
        type: string
    type: object
  dto.ChangePasswordRequest:
    properties:
      current_password:
        maxLength: 128
        type: string
      new_password:
        maxLength: 128
        minLength: 8
        type: string
    required:
    - current_password
    - new_password
    type: object
  dto.ConfirmCatalogImportRequest:
    properties:
      rows:
        items:
          $ref: '#/definitions/dto.CatalogImportInput'
        minItems: 1
        type: array
    required:
    - rows
    type: object
  dto.ConfirmCatalogImportResponse:
    properties:
      imported_rows:
        type: integer
      skipped_rows:
        type: integer
    type: object
  dto.ConfirmEmailRequest:
    properties:
      token:
        type: string
    required:
    - token
    type: object
  dto.ConfirmProductPriceImportRequest:
    properties:
      rows:
        items:
          $ref: '#/definitions/dto.ProductPriceImportInput'
        minItems: 1
        type: array
    required:
    - rows
    type: object
  dto.ConfirmProductPriceImportResponse:
    properties:
      imported_rows:
        type: integer
    type: object
  dto.CreateBranchRequest:
    properties:
      address:
        maxLength: 255
        type: string
      default_expiry_days:
        maximum: 365
        minimum: 1
        type: integer
      name:
        maxLength: 255
        minLength: 1
        type: string
    required:
    - name
    type: object
  dto.CreateProductRequest:
    properties:
      canonical_name:
        maxLength: 255
        minLength: 1
        type: string
      code:
        maxLength: 255
        type: string
      description:
        maxLength: 512
        type: string
      family_id:
        type: string
      subgroup_id:
        type: string
      unit:
        maxLength: 64
        type: string
    required:
    - canonical_name
    - family_id
    type: object
  dto.CreateUserRequest:
    properties:
      branch_ids:
        items:
          type: string
        type: array
      email:
        maxLength: 255
        type: string
      name:
        maxLength: 255
        minLength: 1
        type: string
      password:
        maxLength: 72
        type: string
      role:
        enum:
        - ADMIN
        - SELLER
        type: string
    required:
    - branch_ids
    - email
    - name
    - password
    - role
    type: object
  dto.ErrorResponse:
    properties:
      detail:
        description: set when a body failed binding or validation.
        type: string
      error:
        type: string
    type: object
  dto.ForgotPasswordRequest:
    properties:
      email:
        maxLength: 255
        type: string
    required:
    - email
    type: object
  dto.HealthResponse:
    properties:
      detail:
        type: string
      status:
        type: string
    type: object
  dto.LoginRequest:
    properties:
      email:
        maxLength: 255
        type: string
      password:
        maxLength: 128
        minLength: 8
        type: string
      remember_me:
        type: boolean
    required:
    - email
    - password
    type: object
  dto.LogoutRequest:
    properties:
      refresh_token:
        type: string
    type: object
  dto.MeResponse:
    properties:
      account_id:
        type: string
      branch_ids:
        items:
          type: string
        type: array
      email:
        type: string
      id:
        type: string
      name:
        type: string
      role:
        type: string
    type: object
  dto.PriceListResponse:
    properties:
      items:
        items:
          $ref: '#/definitions/dto.PriceResponse'
        type: array
    type: object
  dto.PriceResponse:
    properties:
      branch_id:
        type: string
      created_at:
        type: string
      currency:
        type: string
      id:
        type: string
      min_price:
        description: discount-engine floor; decimal string.
        type: string
      price:
        description: decimal string, never a float.
        type: string
      product_id:
        type: string
      set_by:
        type: string
      valid_from:
        type: string
      valid_to:
        type: string
    type: object
  dto.ProductListResponse:
    properties:
      items:
        items:
          $ref: '#/definitions/dto.ProductResponse'
        type: array
      limit:
        type: integer
      offset:
        type: integer
      total:
        type: integer
    type: object
  dto.ProductPriceImportInput:
    properties:
      code:
        maxLength: 255
        type: string
      currency:
        type: string
      min_price:
        type: string
      price:
        type: string
    required:
    - code
    - price
    type: object
  dto.ProductPriceImportPreviewResponse:
    properties:
      can_confirm:
        type: boolean
      invalid_rows:
        type: integer
      previewed_at:
        type: string
      rows:
        items:
          $ref: '#/definitions/dto.ProductPriceImportRowResponse'
        type: array
      valid_rows:
        type: integer
    type: object
  dto.ProductPriceImportRowResponse:
    properties:
      code:
        type: string
      currency:
        type: string
      current_min_price:
        type: string
      current_price:
        type: string
      errors:
        items:
          type: string
        type: array
      min_price:
        type: string
      price:
        type: string
      product_name:
        type: string
      row_number:
        type: integer
    type: object
  dto.ProductResponse:
    properties:
      canonical_name:
        type: string
      code:
        type: string
      created_at:
        type: string
      description:
        type: string
      family_id:
        type: string
      id:
        type: string
      is_active:
        type: boolean
      subgroup_id:
        type: string
      unit:
        type: string
      updated_at:
        type: string
    type: object
  dto.RateLimitResponse:
    properties:
      error:
        type: string
      retry_after_seconds:
        type: integer
    type: object
  dto.RefreshRequest:
    properties:
      refresh_token:
        type: string
    required:
    - refresh_token
    type: object
  dto.ResendVerificationRequest:
    properties:
      email:
        maxLength: 255
        type: string
    required:
    - email
    type: object
  dto.ResetPasswordRequest:
    properties:
      new_password:
        maxLength: 128
        minLength: 8
        type: string
      token:
        type: string
    required:
    - new_password
    - token
    type: object
  dto.SetAvailabilityRequest:
    properties:
      is_active:
        type: boolean
      stock:
        type: string
    type: object
  dto.SetPriceRequest:
    properties:
      currency:
        description: e.g. "ARS"; defaults to ARS.
        type: string
      min_price:
        type: string
      price:
        type: string
      valid_from:
        type: string
    required:
    - price
    type: object
  dto.SignupRequest:
    properties:
      account_name:
        maxLength: 255
        minLength: 1
        type: string
      admin_email:
        maxLength: 255
        type: string
      admin_name:
        maxLength: 255
        minLength: 1
        type: string
      admin_password:
        maxLength: 72
        type: string
      branch_address:
        maxLength: 255
        type: string
      branch_name:
        maxLength: 255
        minLength: 1
        type: string
      legal_name:
        maxLength: 255
        type: string
      tax_id:
        maxLength: 255
        type: string
    required:
    - account_name
    - admin_email
    - admin_name
    - admin_password
    - branch_name
    type: object
  dto.SignupResponse:
    properties:
      account:
        $ref: '#/definitions/dto.AccountResponse'
      branch:
        $ref: '#/definitions/dto.BranchResponse'
      tokens:
        $ref: '#/definitions/dto.TokenResponse'
    type: object
  dto.SynonymListResponse:
    properties:
      items:
        items:
          $ref: '#/definitions/dto.SynonymResponse'
        type: array
    type: object
  dto.SynonymResponse:
    properties:
      created_at:
        type: string
      id:
        type: string
      product_id:
        type: string
      source:
        type: string
      term:
        type: string
    type: object
  dto.TokenResponse:
    properties:
      access_expires_at:
        type: string
      access_token:
        type: string
      refresh_token:
        type: string
      user:
        $ref: '#/definitions/dto.UserBrief'
    type: object
  dto.UpdateAccountRequest:
    properties:
      brand_color:
        description: |-
          Hexadecimal, with three, four, six or eight digits behind a hash. Checked here because the
          webapp renders a quote with it, not in whichever client happens to be writing it.
        maxLength: 32
        type: string
      brand_logo_url:
        maxLength: 512
        type: string
      legal_name:
        maxLength: 255
        type: string
      name:
        maxLength: 255
        minLength: 1
        type: string
      tax_id:
        maxLength: 255
        type: string
    required:
    - name
    type: object
  dto.UpdateBranchRequest:
    properties:
      address:
        maxLength: 255
        type: string
      default_expiry_days:
        maximum: 365
        minimum: 1
        type: integer
      is_active:
        type: boolean
      name:
        maxLength: 255
        minLength: 1
        type: string
    required:
    - default_expiry_days
    - name
    type: object
  dto.UpdateProductRequest:
    properties:
      canonical_name:
        maxLength: 255
        minLength: 1
        type: string
      code:
        maxLength: 255
        type: string
      description:
        maxLength: 512
        type: string
      family_id:
        type: string
      is_active:
        type: boolean
      subgroup_id:
        type: string
      unit:
        maxLength: 64
        type: string
    required:
    - canonical_name
    - family_id
    type: object
  dto.UpdateUserRequest:
    properties:
      branch_ids:
        items:
          type: string
        type: array
      email:
        maxLength: 255
        type: string
      is_active:
        type: boolean
      name:
        maxLength: 255
        minLength: 1
        type: string
      role:
        enum:
        - ADMIN
        - SELLER
        type: string
    required:
    - branch_ids
    - email
    - name
    - role
    type: object
  dto.UserBrief:
    properties:
      account_id:
        type: string
      id:
        type: string
      role:
        type: string
    type: object
  dto.UserListResponse:
    properties:
      items:
        items:
          $ref: '#/definitions/dto.UserResponse'
        type: array
    type: object
  dto.UserResponse:
    properties:
      branch_ids:
        items:
          type: string
        type: array
      created_at:
        type: string
      email:
        type: string
      id:
        type: string
      is_active:
        type: boolean
      last_login_at:
        type: string
      name:
        type: string
      role:
        type: string
      updated_at:
        type: string
    type: object
info:
  contact: {}
  description: Every /v1 route outside /public needs an access token. The active branch
    travels in the X-Branch-Id header, not in the token, and is validated per request.
  title: Coti API
  version: "1.0"
paths:
  /health:
    get:
      description: Checks no dependency, so a failing database does not restart the
        container.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.HealthResponse'
      summary: Liveness probe
      tags:
      - health
  /ready:
    get:
      description: 'Reports whether the process can serve traffic: both database pools
        answer.'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.HealthResponse'
        "503":
          description: Service Unavailable
          schema:
            $ref: '#/definitions/dto.HealthResponse'
      summary: Readiness probe
      tags:
      - health
  /v1/account:
    get:
      description: Returns the corralón the caller belongs to, brand included.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.AccountResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Get the current account
      tags:
      - accounts
    put:
      consumes:
      - application/json
      description: Replaces the corralón's record, including the brand the client
        webapp renders a quote with.
      parameters:
      - description: Account
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.UpdateAccountRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.AccountResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "422":
          description: Unprocessable Entity
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Update the current account
      tags:
      - accounts
  /v1/auth/change-password:
    post:
      consumes:
      - application/json
      description: Requires the current password. Ends every other session and returns
        a fresh token pair, so the caller stays logged in and nobody else does.
      parameters:
      - description: Current and new password
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/dto.ChangePasswordRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.TokenResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "422":
          description: New password below the configured minimum length
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Change your own password
      tags:
      - auth
  /v1/auth/logout:
    post:
      consumes:
      - application/json
      description: Advances the session epoch and revokes the presented refresh family.
        The body is optional.
      parameters:
      - description: Refresh token to revoke
        in: body
        name: body
        schema:
          $ref: '#/definitions/dto.LogoutRequest'
      produces:
      - application/json
      responses:
        "204":
          description: Logged out
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Log out
      tags:
      - auth
  /v1/branches:
    get:
      description: Every active branch of the account for an admin; the assigned ones
        for a seller. With include_inactive an administrator also gets the closed
        ones, which is for administering them rather than operating in one.
      parameters:
      - description: Include closed branches (administrators only)
        in: query
        name: include_inactive
        type: boolean
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.BranchListResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      security:
      - BearerAuth: []
      summary: List branches
      tags:
      - branches
    post:
      consumes:
      - application/json
      description: Opens a branch together with its manual-entry channel, which a
        counter or phone order needs.
      parameters:
      - description: Branch
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.CreateBranchRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/dto.BranchResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "422":
          description: Unprocessable Entity
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Create a branch
      tags:
      - branches
  /v1/branches/{branchId}:
    delete:
      description: Deactivates the branch so its quotes and prices stay explainable.
        Refuses to close the account's last active branch.
      parameters:
      - description: Branch id
        in: path
        name: branchId
        required: true
        type: string
      produces:
      - application/json
      responses:
        "204":
          description: No Content
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "422":
          description: Unprocessable Entity
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Close a branch
      tags:
      - branches
    put:
      consumes:
      - application/json
      description: Replaces name, address and default quote expiry. is_active omitted
        leaves the flag alone.
      parameters:
      - description: Branch id
        in: path
        name: branchId
        required: true
        type: string
      - description: Branch
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.UpdateBranchRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.BranchResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "422":
          description: Unprocessable Entity
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Update a branch
      tags:
      - branches
  /v1/me:
    get:
      description: Returns the caller's identity and branch reach, so the frontend
        never has to read the access token itself.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.MeResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Get the current user
      tags:
      - users
  /v1/product-prices/export:
    get:
      description: Returns an XLSX pre-filled with the prices in force for the active
        branch, ready to edit and re-import.
      parameters:
      - description: Active branch
        in: header
        name: X-Branch-Id
        required: true
        type: string
      produces:
      - application/vnd.openxmlformats-officedocument.spreadsheetml.sheet
      responses:
        "200":
          description: OK
          schema:
            type: file
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "422":
          description: Unprocessable Entity
          schema:
