# DigitalOcean App Platform spec for Coti; the map is docs/technical/deployment.md. The repository
# is PUBLIC, so this carries names and shapes only — every credential is a `type: SECRET` with no
# value. Every component takes `source_dir: /`: all three Dockerfiles build the repository root.
name: coti
region: nyc

# Path routing stays here permanently: this file names no host. The webapp's own subdomain and its
# authority rules live in deployment.md, applied to the app. `/q` is the public quote link.
ingress:
  rules:
    - match:
        path:
          prefix: /api
      component:
        name: api
    - match:
        path:
          prefix: /q
      component:
        name: webapp
    - match:
        path:
          prefix: /
      component:
        name: backoffice

databases:
  - name: coti-db
    engine: PG
    version: '16'
    production: true
    # cluster_name / db_name / db_user identify the Managed Postgres cluster and are set when it is
    # created. PostgreSQL 16 or 17, never 15: `vector` is absent from PG15's Standard extensions.

services:
  - name: api
    dockerfile_path: docker/api.Dockerfile
    source_dir: /
    github:
      repo: santialemarino/coti
      branch: main
      deploy_on_push: true
    http_port: 8000
    instance_count: 1
    instance_size_slug: apps-s-1vcpu-1gb
    # /ready checks both pools; /health answers whether the process is up and checks nothing. An
    # unprovisioned coti_app never reaches either — the pools are pinged before startup returns.
    health_check:
      http_path: /ready
    envs:
      - key: ENV
        scope: RUN_TIME
        value: production
      - key: API_PORT
        scope: RUN_TIME
        value: '8000'
      # The owner role, whose URL the platform can bind. Verify it carries sslmode=require and
      # append it if not; Managed Postgres refuses a plaintext connection.
      - key: DATABASE_ADMIN_URL
        scope: RUN_TIME
        type: SECRET
      # coti_app, the NOBYPASSRLS role. config.Load() refuses to boot in production when this
      # equals DATABASE_ADMIN_URL, because that would bypass every row level security policy.
      - key: DATABASE_URL
        scope: RUN_TIME
        type: SECRET
      - key: AUTH_JWT_SECRET
        scope: RUN_TIME
        type: SECRET
      - key: STORAGE_LOCAL_SIGNING_SECRET
        scope: RUN_TIME
        type: SECRET
      - key: CHANNEL_CONFIG_ENCRYPTION_KEY
        scope: RUN_TIME
        type: SECRET
      - key: AI_ANTHROPIC_API_KEY
        scope: RUN_TIME
        type: SECRET
      - key: AI_OPENAI_API_KEY
        scope: RUN_TIME
        type: SECRET
      - key: MAIL_SMTP_USERNAME
        scope: RUN_TIME
        type: SECRET
      - key: MAIL_SMTP_PASSWORD
        scope: RUN_TIME
        type: SECRET
      # Every selector below is OFF, so the app boots on the two database URLs, AUTH_JWT_SECRET and
      # STORAGE_LOCAL_SIGNING_SECRET alone. Turning one on makes its own credential required at
      # startup: an empty SECRET beside an enabled capability is a deploy that never starts.
      - key: AI_LLM_PROVIDER
        scope: RUN_TIME
        value: disabled
      - key: AI_EMBEDDINGS_PROVIDER
        scope: RUN_TIME
        value: disabled
      - key: AI_TRANSCRIPTION_PROVIDER
        scope: RUN_TIME
        value: disabled
      # console writes the message to the log. smtp needs MAIL_FROM_ADDRESS and both credentials,
      # and MAIL_FROM_ADDRESS must be the mailbox itself or Google rewrites the From header.
      - key: MAIL_PROVIDER
        scope: RUN_TIME
        value: console
      - key: MAIL_SMTP_HOST
        scope: RUN_TIME
        type: SECRET
      - key: MAIL_FROM_ADDRESS
        scope: RUN_TIME
        type: SECRET
      # Both or neither, in either direction: hop counting is spoof-resistant only for a request
      # that really transited the declared chain, and CIDRs with the count at 0 are never read.
      # Raise this to 1 when the CIDRs secret holds the platform's forwarding range.
      - key: RATE_LIMIT_TRUSTED_PROXY_HOPS
        scope: RUN_TIME
        value: '0'
      - key: RATE_LIMIT_TRUSTED_PROXY_CIDRS
        scope: RUN_TIME
        type: SECRET
      # Where the API's own signed storage links point, and where the mailed links land. Bound
      # rather than written in, because unlike NEXT_PUBLIC_API_URL these are read at run time.
      - key: STORAGE_LOCAL_API_BASE_URL
        scope: RUN_TIME
        value: ${APP_URL}/api
      - key: WEB_BACKOFFICE_URL
        scope: RUN_TIME
        value: ${APP_URL}
      - key: WEB_WEBAPP_URL
        scope: RUN_TIME
        value: ${APP_URL}

  - name: backoffice
    dockerfile_path: docker/backoffice.Dockerfile
    source_dir: /
    github:
      repo: santialemarino/coti
      branch: main
      deploy_on_push: true
    http_port: 3000
    instance_count: 1
    instance_size_slug: apps-s-1vcpu-1gb
    envs:
      # RUN_AND_BUILD_TIME is load-bearing: this is a build ARG baked into the bundle, and a
      # bindable resolves at runtime only here. deployment.md has the round trip that forces.
      - key: NEXT_PUBLIC_API_URL
        scope: RUN_AND_BUILD_TIME
        value: http://localhost:8000
      # The backoffice proxies every call server-side, so until a hop is declared here and on the
      # API the two share one rate-limit allowance for every user. Both move together, and what
      # each is worth depends on how many proxies the platform actually puts in front.
      - key: WEB_TRUSTED_PROXY_HOPS
        scope: RUN_TIME
        value: '0'

  - name: webapp
    dockerfile_path: docker/webapp.Dockerfile
    source_dir: /
    github:
      repo: santialemarino/coti
      branch: main
      deploy_on_push: true
    http_port: 3001
    instance_count: 1
    instance_size_slug: apps-s-1vcpu-1gb
    envs:
      # Same as the backoffice: a build ARG, so a literal the second deploy fills in.
      - key: NEXT_PUBLIC_API_URL
        scope: RUN_AND_BUILD_TIME
        value: http://localhost:8000

jobs:
  # Migrations run here rather than on API startup: startup migration races across instances, and a
  # bad migration takes the app down instead of failing the deploy. PRE_DEPLOY runs once, before the
  # new containers take traffic, and a failure leaves the old version serving.
  - name: migrate
    kind: PRE_DEPLOY
    dockerfile_path: docker/api.Dockerfile
    source_dir: /
    github:
      repo: santialemarino/coti
      branch: main
      deploy_on_push: true
    instance_size_slug: apps-s-1vcpu-1gb
    run_command: /api/bin/goose -dir /api/migrations postgres "$DATABASE_ADMIN_URL" up
    envs:
      - key: DATABASE_ADMIN_URL
        scope: RUN_TIME
        type: SECRET

  # Correction embeddings are attempted immediately after sending. This sweep only recovers the
  # durable PENDING rows left by a provider outage; App Platform's minimum interval is 15 minutes.
  - name: quote-correction-learning
    kind: SCHEDULED
    schedule:
      cron: '*/15 * * * *'
      time_zone: America/Argentina/Buenos_Aires
    dockerfile_path: docker/api.Dockerfile
    source_dir: /
    github:
      repo: santialemarino/coti
      branch: main
      deploy_on_push: true
    instance_size_slug: apps-s-1vcpu-1gb
    run_command: /api/bin/scheduled-job --job quote-correction-learning
    envs:
      - key: ENV
        scope: RUN_TIME
        value: production
      - key: DATABASE_ADMIN_URL
        scope: RUN_TIME
        type: SECRET
      - key: DATABASE_URL
        scope: RUN_TIME
        type: SECRET
      - key: AUTH_JWT_SECRET
        scope: RUN_TIME
        type: SECRET
      - key: STORAGE_LOCAL_SIGNING_SECRET
        scope: RUN_TIME
        type: SECRET
      - key: AI_EMBEDDINGS_PROVIDER
        scope: RUN_TIME
        value: openai
      - key: AI_OPENAI_API_KEY
        scope: RUN_TIME
        type: SECRET

  # A send remains successful when its post-commit quality evaluation fails. This bounded sweep
  # recovers those missing labels and then hands correction embeddings to their existing retry.
  - name: quote-quality-evaluation
    kind: SCHEDULED
    schedule:
      cron: '*/15 * * * *'
      time_zone: America/Argentina/Buenos_Aires
    dockerfile_path: docker/api.Dockerfile
    source_dir: /
    github:
      repo: santialemarino/coti
      branch: main
      deploy_on_push: true
    instance_size_slug: apps-s-1vcpu-1gb
    run_command: /api/bin/scheduled-job --job quote-quality-evaluation
    envs:
      - key: ENV
        scope: RUN_TIME
        value: production
      - key: DATABASE_ADMIN_URL
        scope: RUN_TIME
        type: SECRET
      - key: DATABASE_URL
        scope: RUN_TIME
        type: SECRET
      - key: AUTH_JWT_SECRET
        scope: RUN_TIME
        type: SECRET
      - key: STORAGE_LOCAL_SIGNING_SECRET
        scope: RUN_TIME
        type: SECRET
      - key: AI_EMBEDDINGS_PROVIDER
        scope: RUN_TIME
        value: openai
      - key: AI_OPENAI_API_KEY
        scope: RUN_TIME
        type: SECRET
