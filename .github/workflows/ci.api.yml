name: CI API

run-name: 'CI API by @${{ github.actor }}'

on:
  workflow_call:
  pull_request:
    branches:
      - main
      - dev
    paths:
      - 'apps/api/**'
  workflow_dispatch:

jobs:
  ci-api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
      - name: Download dependencies
        run: go mod download
      - name: Format check
        run: test -z "$(gofmt -l .)"
      - name: Vet
        run: go vet ./...
      # Pinned to v1 to match the schema of apps/api/.golangci.yml. Built from source
      # with the toolchain above: the prebuilt v1 binaries are compiled with Go 1.24
      # and refuse a module targeting 1.25.
      - name: Lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: v1.64.8
          install-mode: goinstall
          working-directory: apps/api
      - name: Build
        run: go build -o /dev/null ./...
      - name: Test
        run: go test ./...

  # Separate job: the integration suite needs a real PostgreSQL with pgvector, and the
  # migration chain applied. It is what guards tenant isolation, so it belongs in CI even
  # though it is slower than the unit suite.
  ci-api-integration:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: coti
          POSTGRES_PASSWORD: coti
          POSTGRES_DB: coti
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
      - name: Download dependencies
        run: go mod download
      - name: Apply migrations
        working-directory: .
        env:
          DATABASE_ADMIN_URL: postgres://coti:coti@localhost:5432/coti?sslmode=disable
        run: node scripts/goose.mjs up
      - name: Integration tests
        env:
          TEST_DATABASE_URL: postgres://coti_app:coti_app@localhost:5432/coti?sslmode=disable
          TEST_DATABASE_ADMIN_URL: postgres://coti:coti@localhost:5432/coti?sslmode=disable
        run: go test -tags=integration -count=1 ./...
