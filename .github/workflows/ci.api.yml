name: CI API

run-name: 'CI API by @${{ github.actor }}'

# No `on.paths` filter: the workflow reports on every PR, so `ci-api-required` can be a required
# check. The `changes` job decides which jobs run from the PR's changed files; outside a PR (a push,
# a manual run, the release) every job runs.
on:
  workflow_call:
  push:
    branches:
      - dev
  pull_request:
    branches:
      - main
      - dev
  workflow_dispatch:

# A newer push to the same PR supersedes the older run; pushes and the release never cancel.
concurrency:
  group: ci-api-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      api: ${{ steps.areas.outputs.api }}
      scripts: ${{ steps.areas.outputs.scripts }}
    steps:
      # A renamed file counts under both names.
      - name: List the changed files
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/${{ github.event.pull_request.number }}/files" \
            --jq '.[] | .filename, (.previous_filename // empty)' > "$RUNNER_TEMP/changed-files.txt"
          cat "$RUNNER_TEMP/changed-files.txt"
      # First match wins. A root file no rule names runs everything.
      - name: Flag the changed areas
        id: areas
        run: |
          if [ "$GITHUB_EVENT_NAME" != pull_request ]; then
            api=true scripts=true
          else
            api=false scripts=false
            while IFS= read -r path; do
              case "$path" in
                apps/api/migrations/*) api=true scripts=true ;;
                apps/api/*) api=true ;;
                scripts/* | package.json | pnpm-lock.yaml) scripts=true ;;
                .github/workflows/ci.api.yml) api=true scripts=true ;;
                apps/* | packages/* | docs/* | docker/* | .do/* | .claude/* | .agents/* | .github/* \
                  | *.md | turbo.json | pnpm-workspace.yaml | .dockerignore) ;;
                *) api=true scripts=true ;;
              esac
            done < "$RUNNER_TEMP/changed-files.txt"
          fi
          echo "api=$api scripts=$scripts"
          {
            echo "api=$api"
            echo "scripts=$scripts"
          } >> "$GITHUB_OUTPUT"

  ci-api:
    needs: changes
    if: always() && !cancelled() && needs.changes.outputs.api != 'false'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache-dependency-path: apps/api/go.sum
      - name: Download dependencies
        run: go mod download
      - name: Format check
        run: test -z "$(gofmt -l .)"
      - name: Vet
        run: go vet ./...
      # Pinned to v1 to match the schema of the repo-root .golangci.yml, which
      # golangci-lint finds by searching upward from this working directory. Built from
      # source with the toolchain above: the prebuilt v1 binaries are compiled with Go
      # 1.24 and refuse a module targeting 1.25.
      - name: Lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: v1.64.8
          install-mode: goinstall
          working-directory: apps/api
      - name: Build
        run: go build -o /dev/null ./...
      # The committed spec is generated from the handler annotations, so it can go stale
      # the moment a handler changes. Regenerating and comparing is what keeps the
      # annotations verified instead of decorative. git status, not git diff: a file swag
      # newly emits is untracked, and a diff cannot see it.
      - name: OpenAPI spec is up to date
        run: |
          go tool swag init --generalInfo main.go --dir cmd/api,internal/delivery/http --output docs --parseInternal
          if [ -n "$(git status --porcelain -- docs)" ]; then
            echo 'The committed OpenAPI spec does not match the handler annotations.'
            echo 'Run `pnpm docs:api` and commit apps/api/docs/.'
            git status --porcelain -- docs
            git diff -- docs
            exit 1
          fi
      - name: Test
        run: go test ./...

  # Separate job: the integration suite needs a real PostgreSQL with pgvector, and the
  # migration chain applied. It is what guards tenant isolation, so it belongs in CI even
  # though it is slower than the unit suite.
  ci-api-integration:
    needs: changes
    if: always() && !cancelled() && needs.changes.outputs.api != 'false'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: coti
          POSTGRES_PASSWORD: coti
          POSTGRES_DB: coti
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache-dependency-path: apps/api/go.sum
      - name: Download dependencies
        run: go mod download
      - name: Apply migrations
        working-directory: .
        env:
          DATABASE_ADMIN_URL: postgres://coti:coti@127.0.0.1:5432/coti?sslmode=disable
        run: node scripts/goose.mjs up
      # The chain creates the app role with no password, so nothing can connect as it until this
      # runs. Here the value is a published default; a deployment provisions its own instead.
      - name: Set the app role's password
        env:
          PGPASSWORD: coti
        run: psql -h 127.0.0.1 -U coti -d coti -c "ALTER ROLE coti_app PASSWORD 'coti_app'"
      # Coverage is measured here rather than in the unit job because this run is a superset: a
      # build tag only adds files, so this compiles in both suites. The unit job alone would
      # report the repository package at zero, all of whose tests are tagged.
      - name: Integration tests
        env:
          TEST_DATABASE_URL: postgres://coti_app:coti_app@127.0.0.1:5432/coti?sslmode=disable
          TEST_DATABASE_ADMIN_URL: postgres://coti:coti@127.0.0.1:5432/coti?sslmode=disable
        run: go test -tags=integration -count=1 -coverpkg=./internal/... -coverprofile=coverage.out ./...
      # A cleanup that fails reports nothing on its own, which is how a stray account once
      # survived a passing run and stayed in a developer's database. This job applies migrations
      # and seeds nothing, so every table has to be empty again once the suite is done.
      - name: Assert the suite left no rows behind
        env:
          PGPASSWORD: coti
        run: |
          leftovers=$(psql -h 127.0.0.1 -U coti -d coti -tAc "
            SELECT string_agg(c.relname || '=' || rows, ', ' ORDER BY c.relname)
            FROM pg_class c
            JOIN pg_namespace n ON n.oid = c.relnamespace
            CROSS JOIN LATERAL (
              SELECT (xpath('/row/c/text()', query_to_xml(
                format('SELECT count(*) AS c FROM public.%I', c.relname), false, true, '')))[1]::text::bigint
            ) AS counted(rows)
              WHERE c.relkind = 'r' AND n.nspname = 'public'
                AND c.relname NOT IN ('goose_db_version', 'product_family', 'product_subgroup')
                AND rows > 0")
          if [ -n "$leftovers" ]; then
            echo "The integration suite left rows behind: $leftovers"
            exit 1
          fi
      # Reported, never enforced: a threshold set before the suites are real gets met by writing
      # tests that assert nothing. It lands in the job summary so the number is readable without
      # opening the log. cmd/api and the generated docs stay out of the denominator.
      - name: Coverage
        run: |
          {
            echo '### API coverage — `internal/`'
            echo
            echo '```'
            go tool cover -func=coverage.out | awk '$1 == "total:" {print "total  " $3}'
            go tool cover -func=coverage.out | grep -v '^total:' \
              | sed 's|github.com/santialemarino/coti/apps/api/||' \
              | awk -F'[:\t]' '{n=$1; sub(/\/[^\/]*$/,"",n); g=$NF; gsub(/%/,"",g); s[n]+=g; c[n]++}
                               END {for (k in s) printf "%-38s %5.1f%%\n", k, s[k]/c[k]}' | sort
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  ci-scripts:
    needs: changes
    if: always() && !cancelled() && needs.changes.outputs.scripts != 'false'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Format check
        run: pnpm prettier --check 'scripts/**' package.json
      # The database-backed tests skip themselves without a connection string, so this job
      # covers the half that needs nothing — argument parsing, which is what a mistyped
      # command line hits first.
      - name: Tests
        run: pnpm test:scripts

  # Separate job: exercising the commands for real needs a PostgreSQL with the migration chain
  # applied, the same setup the API integration suite uses.
  ci-scripts-integration:
    needs: changes
    if: always() && !cancelled() && needs.changes.outputs.scripts != 'false'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: coti
          POSTGRES_PASSWORD: coti
          POSTGRES_DB: coti
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache-dependency-path: apps/api/go.sum
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Apply migrations
        env:
          DATABASE_ADMIN_URL: postgres://coti:coti@127.0.0.1:5432/coti?sslmode=disable
        run: node scripts/goose.mjs up
      - name: Tests
        env:
          TEST_DATABASE_ADMIN_URL: postgres://coti:coti@127.0.0.1:5432/coti?sslmode=disable
        run: pnpm test:scripts

  # The check to mark required. It always runs, and passes only when every job of a flagged area
  # succeeded and every other job was skipped; a failure, a cancellation or a skipped flagged job fails it.
  ci-api-required:
    needs: [changes, ci-api, ci-api-integration, ci-scripts, ci-scripts-integration]
    if: always()
    runs-on: ubuntu-latest
    steps:
      # `always()` on the step too: the default `success()` is false on a cancelled run, and the job
      # would pass on a skipped step.
      - name: Require every flagged job
        if: always()
        env:
          API: ${{ needs.changes.outputs.api }}
          SCRIPTS: ${{ needs.changes.outputs.scripts }}
          CI_API: ${{ needs.ci-api.result }}
          CI_API_INTEGRATION: ${{ needs.ci-api-integration.result }}
          CI_SCRIPTS: ${{ needs.ci-scripts.result }}
          CI_SCRIPTS_INTEGRATION: ${{ needs.ci-scripts-integration.result }}
        run: |
          fail=0
          check() {
            if [ "$1" = false ]; then want=skipped; else want=success; fi
            echo "$3: $2 (expected $want)"
            [ "$2" = "$want" ] || fail=1
          }
          check "$API" "$CI_API" ci-api
          check "$API" "$CI_API_INTEGRATION" ci-api-integration
          check "$SCRIPTS" "$CI_SCRIPTS" ci-scripts
          check "$SCRIPTS" "$CI_SCRIPTS_INTEGRATION" ci-scripts-integration
          exit "$fail"
