name: CI API

run-name: 'CI API by @${{ github.actor }}'

on:
  workflow_call:
  pull_request:
    branches:
      - main
      - dev
    paths:
      - 'apps/api/**'
  workflow_dispatch:

jobs:
  ci-api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
      - name: Download dependencies
        run: go mod download
      - name: Format check
        run: test -z "$(gofmt -l .)"
      - name: Vet
        run: go vet ./...
      # Pinned to v1 to match the schema of apps/api/.golangci.yml. Built from source
      # with the toolchain above: the prebuilt v1 binaries are compiled with Go 1.24
      # and refuse a module targeting 1.25.
      - name: Lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: v1.64.8
          install-mode: goinstall
          working-directory: apps/api
      - name: Build
        run: go build -o /dev/null ./...
      - name: Test
        run: go test ./...
