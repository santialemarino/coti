name: CI Webapp

run-name: 'CI Webapp by @${{ github.actor }}'

on:
  workflow_call:
  push:
    branches:
      - main
      - dev
    paths:
      - 'apps/webapp/**'
      - 'packages/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'turbo.json'
      - '.github/workflows/ci.webapp.yml'
  pull_request:
    branches:
      - main
      - dev
    paths:
      - 'apps/webapp/**'
      - 'packages/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'turbo.json'
      - '.github/workflows/ci.webapp.yml'
  workflow_dispatch:

jobs:
  ci-webapp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.30.1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm --filter webapp run lint
      - name: Type check
        run: pnpm --filter webapp run check-types
      - name: Test
        run: pnpm --filter webapp run test:coverage
      # Reported, never enforced: a threshold set before the suites are real gets met by writing
      # tests that assert nothing. It lands in the job summary so the number needs no log dive.
      - name: Coverage
        run: |
          {
            echo '### Webapp coverage'
            echo
            echo '```'
            node -e "const t=require('./apps/webapp/coverage/coverage-summary.json').total;for(const k of ['statements','branches','functions','lines'])console.log(k.padEnd(12),t[k].pct.toFixed(1)+'%')"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Build UI package
        run: pnpm build:ui
      - name: Build webapp
        run: pnpm build:webapp
