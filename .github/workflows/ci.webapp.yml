name: CI Webapp

run-name: 'CI Webapp by @${{ github.actor }}'

on:
  workflow_call:
  pull_request:
    branches:
      - main
      - dev
    paths:
      - 'apps/webapp/**'
      - 'packages/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'turbo.json'
  workflow_dispatch:

jobs:
  ci-webapp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.30.1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm --filter webapp run lint
      - name: Type check
        run: pnpm --filter webapp run check-types
      - name: Build UI package
        run: pnpm build:ui
      - name: Build webapp
        run: pnpm build:webapp
