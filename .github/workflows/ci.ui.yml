name: CI UI

run-name: 'CI UI by @${{ github.actor }}'

on:
  workflow_call:
  pull_request:
    branches:
      - main
      - dev
    paths:
      - 'packages/ui/**'
      - 'packages/vitest-config/**'
      - 'packages/eslint-config/**'
      - 'packages/typescript-config/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'turbo.json'
      - '.github/workflows/ci.ui.yml'
  workflow_dispatch:

jobs:
  ci-ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.30.1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm --filter @repo/ui run lint
      - name: Type check
        run: pnpm --filter @repo/ui run check-types
      - name: Test
        run: pnpm --filter @repo/ui run test
      - name: Build
        run: pnpm build:ui
