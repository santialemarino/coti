name: CI Web

run-name: 'CI Web by @${{ github.actor }}'

# No `on.paths` filter: the workflow reports on every PR, so `ci-web-required` can be a required
# check. The `changes` job decides which jobs run from the PR's changed files; outside a PR (a push,
# a manual run) and under `full` (the release) every job runs.
on:
  workflow_call:
    inputs:
      full:
        description: Run every job whatever changed (the release passes true).
        type: boolean
        default: false
  push:
    branches:
      - dev
  pull_request:
    branches:
      - main
      - dev
  workflow_dispatch:

# A newer push to the same PR supersedes the older run; pushes and the release never cancel.
concurrency:
  group: ci-web-${{ github.event_name == 'pull_request' && !inputs.full && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' && !inputs.full }}

jobs:
  changes:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      backoffice: ${{ steps.areas.outputs.backoffice }}
      webapp: ${{ steps.areas.outputs.webapp }}
      ui: ${{ steps.areas.outputs.ui }}
      skills: ${{ steps.areas.outputs.skills }}
    steps:
      # A renamed file counts under both names.
      - name: List the changed files
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/${{ github.event.pull_request.number }}/files" \
            --jq '.[] | .filename, (.previous_filename // empty)' > "$RUNNER_TEMP/changed-files.txt"
          cat "$RUNNER_TEMP/changed-files.txt"
      # First match wins. A root file no rule names runs everything.
      - name: Flag the changed areas
        id: areas
        env:
          FULL: ${{ inputs.full }}
        run: |
          if [ "$GITHUB_EVENT_NAME" != pull_request ] || [ "$FULL" = true ]; then
            backoffice=true webapp=true ui=true skills=true
          else
            backoffice=false webapp=false ui=false skills=false
            while IFS= read -r path; do
              case "$path" in
                packages/ui/* | packages/vitest-config/* | packages/eslint-config/* | packages/typescript-config/*) backoffice=true webapp=true ui=true ;;
                packages/*) backoffice=true webapp=true ;;
                apps/backoffice/*) backoffice=true ;;
                apps/webapp/*) webapp=true ;;
                package.json | pnpm-lock.yaml | turbo.json) backoffice=true webapp=true ui=true ;;
                .claude/skills/* | .agents/skills/* | AGENTS.md | CLAUDE.md) skills=true ;;
                .github/workflows/ci.web.yml) backoffice=true webapp=true ui=true skills=true ;;
                apps/* | scripts/* | docs/* | docker/* | .do/* | .claude/* | .agents/* | .github/* \
                  | *.md | .dockerignore) ;;
                *) backoffice=true webapp=true ui=true skills=true ;;
              esac
            done < "$RUNNER_TEMP/changed-files.txt"
          fi
          echo "backoffice=$backoffice webapp=$webapp ui=$ui skills=$skills"
          {
            echo "backoffice=$backoffice"
            echo "webapp=$webapp"
            echo "ui=$ui"
            echo "skills=$skills"
          } >> "$GITHUB_OUTPUT"

  ci-backoffice:
    needs: changes
    if: always() && !cancelled() && needs.changes.outputs.backoffice != 'false'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.30.1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm --filter backoffice run lint
      - name: Type check
        run: pnpm --filter backoffice run check-types
      - name: Test
        run: pnpm --filter backoffice run test:coverage
      # Reported, never enforced: a threshold set before the suites are real gets met by writing
      # tests that assert nothing. It lands in the job summary so the number needs no log dive.
      - name: Coverage
        run: |
          {
            echo '### Backoffice coverage'
            echo
            echo '```'
            node -e "const t=require('./apps/backoffice/coverage/coverage-summary.json').total;for(const k of ['statements','branches','functions','lines'])console.log(k.padEnd(12),t[k].pct.toFixed(1)+'%')"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Build UI package
        run: pnpm build:ui
      - name: Build backoffice
        run: pnpm build:backoffice

  ci-webapp:
    needs: changes
    if: always() && !cancelled() && needs.changes.outputs.webapp != 'false'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.30.1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm --filter webapp run lint
      - name: Type check
        run: pnpm --filter webapp run check-types
      - name: Test
        run: pnpm --filter webapp run test:coverage
      # Reported, never enforced: a threshold set before the suites are real gets met by writing
      # tests that assert nothing. It lands in the job summary so the number needs no log dive.
      - name: Coverage
        run: |
          {
            echo '### Webapp coverage'
            echo
            echo '```'
            node -e "const t=require('./apps/webapp/coverage/coverage-summary.json').total;for(const k of ['statements','branches','functions','lines'])console.log(k.padEnd(12),t[k].pct.toFixed(1)+'%')"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Build UI package
        run: pnpm build:ui
      - name: Build webapp
        run: pnpm build:webapp

  ci-ui:
    needs: changes
    if: always() && !cancelled() && needs.changes.outputs.ui != 'false'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.30.1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm --filter @repo/ui run lint
      - name: Type check
        run: pnpm --filter @repo/ui run check-types
      - name: Test
        run: pnpm --filter @repo/ui run test:coverage
      # Reported, never enforced: a threshold set before the suites are real gets met by writing
      # tests that assert nothing. It lands in the job summary so the number needs no log dive.
      - name: Coverage
        run: |
          {
            echo '### Design system coverage'
            echo
            echo '```'
            node -e "const t=require('./packages/ui/coverage/coverage-summary.json').total;for(const k of ['statements','branches','functions','lines'])console.log(k.padEnd(12),t[k].pct.toFixed(1)+'%')"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Build
        run: pnpm build:ui

  ci-skills:
    needs: changes
    if: always() && !cancelled() && needs.changes.outputs.skills != 'false'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      # `diff -r` reports a file present in one tree only, which a per-file compare would miss
      # entirely — a whole skill added to one side and not the other is the likeliest drift.
      - name: Mirrors are byte-equal
        run: diff -r .claude/skills .agents/skills
      - name: Format check
        run: pnpm prettier --check '.claude/skills/**/*.md' '.agents/skills/**/*.md' CLAUDE.md AGENTS.md

  # The check to mark required. It always runs, and passes only when every job of a flagged area
  # succeeded and every other job was skipped; a failure, a cancellation or a skipped flagged job fails it.
  ci-web-required:
    needs: [changes, ci-backoffice, ci-webapp, ci-ui, ci-skills]
    if: always()
    runs-on: ubuntu-latest
    steps:
      # `always()` on the step too: the default `success()` is false on a cancelled run, and the job
      # would pass on a skipped step.
      - name: Require every flagged job
        if: always()
        env:
          BACKOFFICE: ${{ needs.changes.outputs.backoffice }}
          WEBAPP: ${{ needs.changes.outputs.webapp }}
          UI: ${{ needs.changes.outputs.ui }}
          SKILLS: ${{ needs.changes.outputs.skills }}
          CI_BACKOFFICE: ${{ needs.ci-backoffice.result }}
          CI_WEBAPP: ${{ needs.ci-webapp.result }}
          CI_UI: ${{ needs.ci-ui.result }}
          CI_SKILLS: ${{ needs.ci-skills.result }}
        run: |
          fail=0
          check() {
            if [ "$1" = false ]; then want=skipped; else want=success; fi
            echo "$3: $2 (expected $want)"
            [ "$2" = "$want" ] || fail=1
          }
          check "$BACKOFFICE" "$CI_BACKOFFICE" ci-backoffice
          check "$WEBAPP" "$CI_WEBAPP" ci-webapp
          check "$UI" "$CI_UI" ci-ui
          check "$SKILLS" "$CI_SKILLS" ci-skills
          exit "$fail"
