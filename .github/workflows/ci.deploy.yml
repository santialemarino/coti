name: CI Deploy

run-name: 'CI Deploy by @${{ github.actor }}'

# No `on.paths` filter: the workflow reports on every PR, so `ci-deploy-required` can be a required
# check. The `changes` job decides which jobs run from the PR's changed files; outside a PR (a push,
# a manual run, the release) every job runs.
on:
  workflow_call:
  push:
    branches:
      - dev
  pull_request:
    branches:
      - main
      - dev
      - tmp/ci-gating-base
  workflow_dispatch:

# A newer push to the same PR supersedes the older run; pushes and the release never cancel.
concurrency:
  group: ci-deploy-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  DOCTL_VERSION: 1.167.0
  SPEC: .do/app.yaml

jobs:
  changes:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      docker: ${{ steps.areas.outputs.docker }}
      deploy_spec: ${{ steps.areas.outputs.deploy_spec }}
    steps:
      # A renamed file counts under both names.
      - name: List the changed files
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/${{ github.event.pull_request.number }}/files" \
            --jq '.[] | .filename, (.previous_filename // empty)' > "$RUNNER_TEMP/changed-files.txt"
          cat "$RUNNER_TEMP/changed-files.txt"
      # First match wins. A root file no rule names runs everything.
      - name: Flag the changed areas
        id: areas
        run: |
          if [ "$GITHUB_EVENT_NAME" != pull_request ]; then
            docker=true deploy_spec=true
          else
            docker=false deploy_spec=false
            while IFS= read -r path; do
              case "$path" in
                apps/api/internal/config/* | docker/*) docker=true deploy_spec=true ;;
                .do/*) deploy_spec=true ;;
                apps/* | packages/* | package.json | pnpm-lock.yaml | pnpm-workspace.yaml | turbo.json | .dockerignore) docker=true ;;
                .github/workflows/ci.deploy.yml) docker=true deploy_spec=true ;;
                scripts/* | docs/* | .claude/* | .agents/* | .github/* | *.md) ;;
                *) docker=true deploy_spec=true ;;
              esac
            done < "$RUNNER_TEMP/changed-files.txt"
          fi
          echo "docker=$docker deploy_spec=$deploy_spec"
          {
            echo "docker=$docker"
            echo "deploy_spec=$deploy_spec"
          } >> "$GITHUB_OUTPUT"

  # Both web images bake NEXT_PUBLIC_API_URL into the JS bundle at build time, so the build needs
  # a value even though the deploy supplies the real one.
  ci-docker-web:
    needs: changes
    if: always() && !cancelled() && needs.changes.outputs.docker != 'false'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - app: backoffice
            port: 3000
          - app: webapp
            port: 3001
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: |
          docker build \
            -f docker/${{ matrix.app }}.Dockerfile \
            --build-arg NEXT_PUBLIC_API_URL=http://localhost:8000 \
            -t coti-${{ matrix.app }}:ci .
      # An image that builds and cannot start is the failure this workflow exists to catch, so
      # answering at all is the assertion — the status code depends on an API that is not here.
      - name: The image serves
        run: |
          docker run -d --name ${{ matrix.app }} \
            -p ${{ matrix.port }}:${{ matrix.port }} coti-${{ matrix.app }}:ci
          for _ in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w '%{http_code}' \
              http://127.0.0.1:${{ matrix.port }}/) || code=000
            if [ "$code" != '000' ]; then break; fi
            sleep 2
          done
          if [ "$code" = '000' ]; then
            docker logs ${{ matrix.app }}
            echo 'The ${{ matrix.app }} image never answered.'
            exit 1
          fi
          echo "${{ matrix.app }} answered HTTP $code"

  # The api image is the one the platform runs three ways — the API, the scheduled job, and the
  # migration job — so it gets a Postgres and has to prove it can migrate and then serve.
  ci-docker-api:
    needs: changes
    if: always() && !cancelled() && needs.changes.outputs.docker != 'false'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: coti
          POSTGRES_PASSWORD: coti
          POSTGRES_DB: coti
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: docker build -f docker/api.Dockerfile -t coti-api:ci .
      # A missing binary deploys clean, and the component that needed it is the only thing that
      # would ever discover it. What the image contains is a check, not a build artifact.
      - name: The image carries every binary the platform runs
        run: |
          for bin in api catalog-embed goose scheduled-job; do
            docker run --rm --entrypoint ls coti-api:ci "/api/bin/$bin" > /dev/null \
              || { echo "The api image is missing /api/bin/$bin."; exit 1; }
          done
      # The PRE_DEPLOY job runs exactly this. Counting the applied rows is what catches a
      # migrations directory the image copied only part of, which `up` alone reports as success.
      - name: The image applies the migration chain
        run: |
          docker run --rm --network host coti-api:ci \
            /api/bin/goose -dir /api/migrations \
            postgres 'postgres://coti:coti@127.0.0.1:5432/coti?sslmode=disable' up
          applied=$(PGPASSWORD=coti psql -h 127.0.0.1 -U coti -d coti -tAc \
            'SELECT count(*) FROM goose_db_version WHERE version_id > 0')
          on_disk=$(ls -1 apps/api/migrations/*.sql | wc -l)
          if [ "$applied" -ne "$on_disk" ]; then
            echo "The image applied $applied of the $on_disk migrations in the chain."
            exit 1
          fi
      # The app role's password is provisioned by whoever owns the database, never by the chain, so
      # set it here rather than depending on what a migration happens to leave it at.
      - name: Set the app role's password
        env:
          PGPASSWORD: coti
        run: psql -h 127.0.0.1 -U coti -d coti -c "ALTER ROLE coti_app PASSWORD 'coti_app'"
      # The same assertion the web job makes, for the image that matters most: an image that builds
      # and cannot start deploys clean. /ready is the probe App Platform uses, and it answers only
      # once both pools do.
      - name: The image serves
        run: |
          docker run -d --name api --network host \
            -e ENV=production \
            -e DATABASE_URL='postgres://coti_app:coti_app@127.0.0.1:5432/coti?sslmode=disable' \
            -e DATABASE_ADMIN_URL='postgres://coti:coti@127.0.0.1:5432/coti?sslmode=disable' \
            -e AUTH_JWT_SECRET=0123456789abcdef0123456789abcdef \
            -e STORAGE_LOCAL_SIGNING_SECRET=0123456789abcdef0123456789abcdef \
            -e STORAGE_LOCAL_DIR=/var/lib/coti/storage \
            coti-api:ci
          for _ in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8000/ready) || code=000
            if [ "$code" != '000' ]; then break; fi
            sleep 2
          done
          docker logs api
          if [ "$code" != '200' ]; then
            echo "The api image did not become ready (last status $code)."
            exit 1
          fi

  ci-deploy-spec:
    needs: changes
    if: always() && !cancelled() && needs.changes.outputs.deploy_spec != 'false'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        spec: [.do/app.yaml, .do/app.neon.yaml, .do/portal.yaml]
    env:
      SPEC: ${{ matrix.spec }}
    steps:
      - uses: actions/checkout@v4
      - name: Install doctl
        run: |
          curl -fsSL \
            "https://github.com/digitalocean/doctl/releases/download/v${DOCTL_VERSION}/doctl-${DOCTL_VERSION}-linux-amd64.tar.gz" \
            | tar -xz -C "$RUNNER_TEMP" doctl
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - name: The spec matches the App Platform schema
        run: doctl apps spec validate --schema-only "$SPEC" > /dev/null
      - name: Browser handlers and versioned API routes remain reachable
        if: matrix.spec != '.do/portal.yaml'
        run: |
          export ROUTING="$(yq -o=json '.ingress.rules' "$SPEC")"
          python3 - <<'PY'
          import json
          import os

          rules = json.loads(os.environ["ROUTING"])

          def destination(path):
              matches = [r for r in rules if path.startswith(r["match"]["path"]["prefix"])]
              rule = max(matches, key=lambda r: len(r["match"]["path"]["prefix"]))
              prefix = rule["match"]["path"]["prefix"]
              component = rule["component"]
              rewrite = component.get("rewrite", "/")
              forwarded = rewrite + path[len(prefix):].lstrip("/")
              return component["name"], forwarded

          for path in ["/api/channels", "/api/rfqs/file-drafts", "/api/products"]:
              assert destination(path) == ("backoffice", path), path
          for path, forwarded in [("/api/v1/channels", "/v1/channels"),
                                  ("/api/v1/webhooks/whatsapp", "/v1/webhooks/whatsapp"),
                                  ("/api/ready", "/ready"), ("/api/health", "/health")]:
              assert destination(path) == ("api", forwarded), path
          PY
      # This repository is public, so the spec carries names and shapes and never a value. A habit
      # is not a guarantee; this is.
      - name: No SECRET carries a value
        run: |
          leaks=$(yq -r '
            [.services[]?, .jobs[]?, .workers[]?]
            | .[]
            | .name as $component
            | .envs[]? | select(.type == "SECRET" and has("value"))
            | $component + "." + .key' "$SPEC")
          if [ -n "$leaks" ]; then
            echo "These entries are marked SECRET and still carry a value:"
            echo "$leaks"
            exit 1
          fi
      # ARCA_ENVIRONMENT decides which invoices close a sale, and the spec repeats it on every
      # component that reads it; one left behind would close sales the API still shows open.
      - name: Every ARCA_ENVIRONMENT matches the API's
        if: matrix.spec != '.do/portal.yaml'
        run: |
          api=$(yq -r '.services[] | select(.name == "api") | .envs[] | select(.key == "ARCA_ENVIRONMENT") | .value' "$SPEC")
          drift=$(API="$api" yq -r '
            [.services[]?, .jobs[]?, .workers[]?]
            | .[]
            | .name as $component
            | .envs[]? | select(.key == "ARCA_ENVIRONMENT" and .value != strenv(API))
            | $component + "=" + (.value // "")' "$SPEC")
          if [ -z "$api" ] || [ -n "$drift" ]; then
            echo "Every ARCA_ENVIRONMENT must carry the api service's value (${api:-none}):"
            echo "$drift"
            exit 1
          fi
          # A component that reads it but drops the key falls back to the code default unnoticed.
          for component in quote-auto-archive; do
            found=$(NAME="$component" yq -r '
              [.services[]?, .jobs[]?, .workers[]?]
              | .[] | select(.name == strenv(NAME))
              | .envs[]? | select(.key == "ARCA_ENVIRONMENT") | .key' "$SPEC")
            if [ -z "$found" ]; then
              echo "$component reads ARCA_ENVIRONMENT but the spec does not set it"
              exit 1
            fi
          done
      # All three Dockerfiles build with the repository root as their context, so a component
      # pointed anywhere else fails at its first COPY — and a renamed Dockerfile only surfaces as a
      # failed deploy.
      - name: Every component builds the root with a Dockerfile that exists
        run: |
          yq -r '
            [.services[]?, .jobs[]?, .workers[]?]
            | .[]
            | .name + " " + .source_dir + " " + .dockerfile_path' "$SPEC" > "$RUNNER_TEMP/components.txt"
          while read -r name source_dir dockerfile; do
            if [ "$source_dir" != '/' ]; then
              echo "$name has source_dir $source_dir; every component builds the repository root."
              exit 1
            fi
            if [ ! -f "$dockerfile" ]; then
              echo "$name names $dockerfile, which does not exist."
              exit 1
            fi
          done < "$RUNNER_TEMP/components.txt"
      - name: Every ingress rule names a component the spec declares
        run: |
          missing=$(yq -r '
            [.services[]?.name] as $components
            | .ingress.rules[]?
            | select(.component.name as $n | $components | contains([$n]) | not)
            | .component.name' "$SPEC")
          if [ -n "$missing" ]; then
            echo "These ingress rules name components the spec does not declare:"
            echo "$missing"
            exit 1
          fi

  # config.Load() refuses several combinations the spec is free to declare: a capability switched on
  # beside an empty SECRET is a deploy that never starts, and a schema check cannot see it. So the
  # API is booted on the spec's settings, with only the credentials a deploy cannot avoid filled.
  ci-deploy-spec-boots:
    needs: changes
    if: always() && !cancelled() && needs.changes.outputs.deploy_spec != 'false'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: coti
          POSTGRES_PASSWORD: coti
          POSTGRES_DB: coti
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache-dependency-path: apps/api/go.sum
      - name: Build the api image
        run: docker build -f docker/api.Dockerfile -t coti-api:ci .
      # Through the repo's own command rather than the image's copy of goose: what is asserted here
      # is that the spec's settings let the API start, not what the image happens to carry.
      - name: Bring the database to the state a first deploy leaves it in
        env:
          DATABASE_ADMIN_URL: postgres://coti:coti@127.0.0.1:5432/coti?sslmode=disable
          PGPASSWORD: coti
        run: |
          node scripts/goose.mjs up
          psql -h 127.0.0.1 -U coti -d coti -c "ALTER ROLE coti_app PASSWORD 'coti_app'"
      - name: Migration commands expand credentials inside the container
        env:
          DATABASE_ADMIN_URL: postgres://coti:coti@127.0.0.1:5432/coti?sslmode=disable
        run: |
          for spec in .do/app.yaml .do/app.neon.yaml; do
            export MIGRATE_COMMAND="$(yq -r '.jobs[] | select(.name == "migrate") | .run_command' "$spec")"
            python3 - <<'PY'
          import os
          import shlex
          import subprocess

          subprocess.run([
              "docker", "run", "--rm", "--network", "host",
              "--env", "DATABASE_ADMIN_URL", "coti-api:ci",
              *shlex.split(os.environ["MIGRATE_COMMAND"]),
          ], check=True)
          PY
          done
      - name: The API starts on the spec's own settings
        run: |
          DB=127.0.0.1:5432/coti?sslmode=disable
          KEY=0123456789abcdef0123456789abcdef
          yq -r '.services[] | select(.name == "api") | .envs[] | .key + "=" + (.value // "")' \
            "$SPEC" > "$RUNNER_TEMP/raw.env"
          sed -e "s|^DATABASE_ADMIN_URL=$|DATABASE_ADMIN_URL=postgres://coti:coti@$DB|" \
              -e "s|^DATABASE_URL=$|DATABASE_URL=postgres://coti_app:coti_app@$DB|" \
              -e "s|^AUTH_JWT_SECRET=$|AUTH_JWT_SECRET=$KEY|" \
              -e "s|^STORAGE_LOCAL_SIGNING_SECRET=$|STORAGE_LOCAL_SIGNING_SECRET=$KEY|" \
              -e 's|\${APP_URL}|https://coti.example|' \
              "$RUNNER_TEMP/raw.env" > "$RUNNER_TEMP/api.env"
          docker run -d --name api --network host \
            --env-file "$RUNNER_TEMP/api.env" -e STORAGE_LOCAL_DIR=/var/lib/coti/storage \
            coti-api:ci
          for _ in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8000/ready) || code=000
            if [ "$code" != '000' ]; then break; fi
            sleep 2
          done
          docker logs api
          if [ "$code" != '200' ]; then
            echo "The API did not become ready on the spec's settings (last status $code)."
            exit 1
          fi

  # The check to mark required. It always runs, and passes only when every job of a flagged area
  # succeeded and every other job was skipped; a failure, a cancellation or a skipped flagged job fails it.
  ci-deploy-required:
    needs: [changes, ci-docker-web, ci-docker-api, ci-deploy-spec, ci-deploy-spec-boots]
    if: always()
    runs-on: ubuntu-latest
    steps:
      # `always()` on the step too: the default `success()` is false on a cancelled run, and the job
      # would pass on a skipped step.
      - name: Require every flagged job
        if: always()
        env:
          DOCKER: ${{ needs.changes.outputs.docker }}
          DEPLOY_SPEC: ${{ needs.changes.outputs.deploy_spec }}
          CI_DOCKER_WEB: ${{ needs.ci-docker-web.result }}
          CI_DOCKER_API: ${{ needs.ci-docker-api.result }}
          CI_DEPLOY_SPEC: ${{ needs.ci-deploy-spec.result }}
          CI_DEPLOY_SPEC_BOOTS: ${{ needs.ci-deploy-spec-boots.result }}
        run: |
          fail=0
          check() {
            if [ "$1" = false ]; then want=skipped; else want=success; fi
            echo "$3: $2 (expected $want)"
            [ "$2" = "$want" ] || fail=1
          }
          check "$DOCKER" "$CI_DOCKER_WEB" ci-docker-web
          check "$DOCKER" "$CI_DOCKER_API" ci-docker-api
          check "$DEPLOY_SPEC" "$CI_DEPLOY_SPEC" ci-deploy-spec
          check "$DEPLOY_SPEC" "$CI_DEPLOY_SPEC_BOOTS" ci-deploy-spec-boots
          exit "$fail"
