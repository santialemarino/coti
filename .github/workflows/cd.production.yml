name: Production Release

on:
  push:
    branches: [main]
  pull_request:
    branches: [dev, main]
    paths:
      - '.github/workflows/cd.production.yml'
      - 'scripts/deploy-digitalocean*'
      - '.github/scripts/template-envs.sh'
      - '.do/app.neon.yaml'
      - '.do/portal.yaml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deployment-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test scripts/deploy-digitalocean.test.mjs
      - name: Template settings read for the release
        run: |
          .github/scripts/template-envs.sh > "$RUNNER_TEMP/template-envs.json"
          jq -e '.["coti-core"].api | index("DATABASE_URL")' "$RUNNER_TEMP/template-envs.json" > /dev/null
          jq -e '.["coti-core"].backoffice | index("API_INTERNAL_URL")' "$RUNNER_TEMP/template-envs.json" > /dev/null
          jq -e '.["coti-core"].migrate and (.["coti-portal"].webapp | length > 0)' "$RUNNER_TEMP/template-envs.json" > /dev/null

  # Each called workflow's `changes` job asks for pull-requests: read, and a called workflow cannot
  # hold more than its caller grants. Outside a PR it reads nothing and runs every job.
  api:
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
      pull-requests: read
    uses: ./.github/workflows/ci.api.yml
  web:
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
      pull-requests: read
    uses: ./.github/workflows/ci.web.yml
  deploy-checks:
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
      pull-requests: read
    uses: ./.github/workflows/ci.deploy.yml

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: [deployment-tests, api, web, deploy-checks]
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Skip a superseded release
        id: latest
        shell: bash
        run: |
          latest="$(git ls-remote origin refs/heads/main | cut -f1)"
          if [ "$latest" = "$GITHUB_SHA" ]; then
            echo 'current=true' >> "$GITHUB_OUTPUT"
          else
            echo 'A newer main release is queued; skipping this commit.'
          fi
      - name: Read the committed templates' settings
        if: steps.latest.outputs.current == 'true'
        run: echo "DO_TEMPLATE_ENVS=$(.github/scripts/template-envs.sh)" >> "$GITHUB_ENV"
      - name: Deploy core, migrations and customer portal
        if: steps.latest.outputs.current == 'true'
        env:
          DIGITALOCEAN_ACCESS_TOKEN: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}
          DIGITALOCEAN_CORE_APP_ID: ${{ vars.DIGITALOCEAN_CORE_APP_ID }}
          DIGITALOCEAN_PORTAL_APP_ID: ${{ vars.DIGITALOCEAN_PORTAL_APP_ID }}
          DO_DEPLOY_TIMEOUT_SECONDS: '1800'
          DO_DEPLOY_POLL_SECONDS: '10'
        run: node scripts/deploy-digitalocean.mjs
